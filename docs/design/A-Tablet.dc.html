<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Studio Tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF9F0A}a:hover{color:#FFB340}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 28px; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px">
    <button style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; display: flex; align-items: center; gap: 8px; font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M7 3v12" stroke="currentColor" stroke-width="1.6"></path></svg>Bibliothek
    </button>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 17px; font-weight: 600">Kupferblues</div>
      <div style="font-size: 13px; color: {{c.muted}}">Trio Feldweg · 03:48</div>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; width: 160px; text-align: right">00:51.3</div>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 26px; display: flex; align-items: center; gap: 1px; position: relative">
      <sc-for list="{{mini}}" as="b" hint-placeholder-count="100"><div style="{{b.st}}"></div></sc-for>
      <div style="position: absolute; left: 15.8%; width: 13.1%; top: -2px; bottom: -2px; border: 1px solid {{c.text}}; border-radius: 3px"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{c.muted}}">
      <span>00:36</span><span>00:42</span><span>00:48</span><span>00:54</span><span>01:00</span><span>01:06</span>
    </div>
    <div style="height: 240px; position: relative; display: flex; align-items: center; gap: 2px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="110"><div style="{{b.st}}"></div></sc-for>
      <div style="position: absolute; left: 20%; width: 55%; top: 0; bottom: 0; background: {{c.amberSoft}}; border-left: 2px solid {{c.amber}}; border-right: 2px solid {{c.amber}}"></div>
      <div style="position: absolute; left: calc(20% - 22px); bottom: -6px; width: 44px; height: 44px; border-radius: 10px; background: {{c.amber}}; color: #121214; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">S</div>
      <div style="position: absolute; left: calc(75% - 22px); bottom: -6px; width: 44px; height: 44px; border-radius: 10px; background: {{c.amber}}; color: #121214; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">E</div>
      <div style="position: absolute; left: 51%; top: 0; bottom: 0; width: 2px; background: {{c.text}}"></div>
    </div>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.amber}}">LOOP</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600">00:42.0 → 00:58.5</span>
      <span style="color: {{c.muted}}">Durchgang <b style="color: {{c.text}}">7</b> / 10</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 15px">S hier</button>
      <button style="height: 48px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 15px">E hier</button>
      <button style="height: 48px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 15px">− 0,1 s / + 0,1 s</button>
      <button style="height: 48px; border-radius: 8px; border: 1px solid {{c.amber}}; background: {{c.amberSoft}}; color: {{c.text}}; font-size: 15px; font-weight: 600">Loop an</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.muted}}">TEMPO</span>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 60px; font-weight: 600; line-height: 1; color: {{c.amber}}">0,75×</div>
      <div style="position: relative; height: 44px; display: flex; align-items: center">
        <div style="flex: 1; height: 6px; border-radius: 3px; background: {{c.border}}"></div>
        <div style="position: absolute; left: 0; width: 34%; height: 6px; border-radius: 3px; background: {{c.amber}}"></div>
        <div style="position: absolute; left: calc(34% - 14px); width: 28px; height: 28px; border-radius: 14px; background: {{c.text}}"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-family: 'JetBrains Mono', monospace; font-size: 14px">0,5</button>
        <button style="height: 44px; border-radius: 8px; border: 1px solid {{c.amber}}; background: {{c.amberSoft}}; color: {{c.text}}; font-family: 'JetBrains Mono', monospace; font-size: 14px">0,75</button>
        <button style="height: 44px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-family: 'JetBrains Mono', monospace; font-size: 14px">0,8</button>
        <button style="height: 44px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-family: 'JetBrains Mono', monospace; font-size: 14px">1,0</button>
      </div>
    </div>
    <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.muted}}">STEIGERUNG</span>
      <div style="flex: 1; display: flex; align-items: flex-end; gap: 6px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="{{s.barSt}}"></div>
            <span style="{{s.labSt}}">{{s.p}}</span>
          </div>
        </sc-for>
      </div>
      <div style="color: {{c.muted}}; font-size: 14px">+5 % nach 10 Durchgängen · Stufe 4 von 9</div>
    </div>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.muted}}">METRONOM</span>
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 600; color: {{c.blue}}">96</span><span style="color: {{c.muted}}">BPM · 4/4</span></div>
    </div>
    <div style="flex: 1; display: flex; gap: 8px">
      <div style="flex: 1; height: 14px; border-radius: 4px; background: {{c.blue}}"></div>
      <div style="flex: 1; height: 14px; border-radius: 4px; background: {{c.led}}"></div>
      <div style="flex: 1; height: 14px; border-radius: 4px; background: {{c.led}}"></div>
      <div style="flex: 1; height: 14px; border-radius: 4px; background: {{c.led}}"></div>
    </div>
    <button style="height: 48px; width: 80px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 15px">Tap</button>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 16px">
    <button aria-label="Zum Loop-Start" style="width: 56px; height: 48px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2v12M13 2.5v11L5 8z" stroke="currentColor" stroke-width="1.6" fill="currentColor"></path></svg></button>
    <button aria-label="Abspielen" style="width: 72px; height: 48px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dunkel":{"editor":"boolean","default":true},"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dunkel ?? true;
    const c = dark
      ? { bg: '#121214', panel: '#1C1C1F', panel2: '#26262A', border: '#2C2C30', text: '#ECECEF', muted: '#9A9AA3', amber: '#FF9F0A', amberSoft: 'rgba(255,159,10,0.16)', blue: '#4DA3FF', wave: '#4A4A52', led: '#2C2C30' }
      : { bg: '#ECECEF', panel: '#FFFFFF', panel2: '#F4F4F6', border: '#D4D4D9', text: '#18181B', muted: '#5A5A63', amber: '#A85F00', amberSoft: 'rgba(255,159,10,0.18)', blue: '#0A63C2', wave: '#B9B9C0', led: '#D4D4D9' };
    const gen = (n, seed, loopA, loopB, minH) => {
      const out = []; let s = seed;
      for (let i = 0; i < n; i++) {
        s = (s * 9301 + 49297) % 233280;
        const r = s / 233280;
        const env = 0.35 + 0.65 * Math.abs(Math.sin(i / n * Math.PI * 2.6 + 0.4));
        const h = Math.max(minH, Math.round((0.2 + 0.8 * r) * env * 100));
        const f = i / n;
        out.push({ st: 'flex: 1 1 0; height: ' + h + '%; border-radius: 1px; background: ' + (f >= loopA && f < loopB ? c.amber : c.wave) });
      }
      return out;
    };
    const steps = [60, 65, 70, 75, 80, 85, 90, 95, 100].map((p, i) => {
      const state = p < 75 ? 'done' : p === 75 ? 'now' : 'todo';
      return {
        p,
        barSt: 'width: 100%; height: ' + (30 + i * 12) + 'px; border-radius: 4px; background: ' + (state === 'todo' ? c.border : c.amber) + '; opacity: ' + (state === 'done' ? 0.45 : 1) + (state === 'now' ? '; box-shadow: 0 0 0 2px ' + c.text : ''),
        labSt: "font-family: 'JetBrains Mono', monospace; font-size: 12px; color: " + (state === 'now' ? c.text + '; font-weight: 700' : c.muted)
      };
    });
    return { c, steps, bars: gen(110, 7, 0.2, 0.75, 4), mini: gen(100, 3, 0.184, 0.257, 8) };
  }
}
</script>
</body>
</html>

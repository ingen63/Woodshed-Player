<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Fokus Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0066D6}a:hover{color:#004FA8}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 8px 24px 28px; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-feature-settings: 'tnum'; overflow: hidden">

  <div style="width: 100%; display: flex; align-items: center; height: 44px">
    <button style="height: 44px; padding: 0 8px 0 0; border: 0; background: transparent; color: {{c.accent}}; font-size: 17px; display: flex; align-items: center; gap: 2px"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Bibliothek</button>
  </div>

  <div style="font-size: 15px; color: {{c.muted}}; margin-top: 12px">Kupferblues · Trio Feldweg</div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <div style="font-size: 112px; font-weight: 300; line-height: 1; letter-spacing: -0.03em">75<span style="font-size: 52px; color: {{c.muted}}"> %</span></div>
    <div style="font-size: 14px; color: {{c.muted}}">vom Originaltempo</div>
  </div>

  <div style="width: 100%; display: flex; justify-content: space-between">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 32px">
        <div style="{{s.dotSt}}"></div>
        <span style="{{s.labSt}}">{{s.p}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <div style="display: flex; gap: 4px">
      <sc-for list="{{reps}}" as="r" hint-placeholder-count="10"><div style="{{r.st}}"></div></sc-for>
    </div>
    <span style="font-size: 14px; color: {{c.muted}}">7 von 10</span>
  </div>

  <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 4px; border-radius: 2px; background: {{c.surface}}; position: relative">
      <div style="position: absolute; left: 18.4%; width: 7.3%; top: -5px; bottom: -5px; border-radius: 7px; background: {{c.accentFill}}"></div>
      <div style="position: absolute; left: 22.5%; top: -10px; bottom: -10px; width: 2px; background: {{c.text}}"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{c.muted}}"><span>0:00</span><span>3:48</span></div>
  </div>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border-radius: 24px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px">Loop 0:42–0:58</button>
      <button style="height: 48px; border-radius: 24px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px">96 BPM · 4/4</button>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 64px 1fr; gap: 10px; align-items: center">
      <button style="height: 48px; border-radius: 24px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px">S hier</button>
      <button aria-label="Abspielen" style="width: 64px; height: 64px; border-radius: 32px; border: 1.5px solid {{c.text}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"></path></svg></button>
      <button style="height: 48px; border-radius: 24px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px">E hier</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dunkel":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dunkel ?? false;
    const c = dark
      ? { bg: '#000000', surface: '#1C1C1E', border: '#2C2C2E', text: '#F5F5F7', muted: '#A1A1A6', accent: '#3D9BFF', accentFill: '#0A84FF', accentSoft: 'rgba(10,132,255,0.22)' }
      : { bg: '#FFFFFF', surface: '#F5F5F7', border: '#E5E5EA', text: '#1D1D1F', muted: '#6E6E73', accent: '#0066D6', accentFill: '#007AFF', accentSoft: 'rgba(0,122,255,0.12)' };
    const steps = [60, 65, 70, 75, 80, 85, 90, 95, 100].map((p) => {
      const state = p < 75 ? 'done' : p === 75 ? 'now' : 'todo';
      const dotSt = state === 'now'
        ? 'width: 16px; height: 16px; border-radius: 8px; background: ' + c.accentFill + '; box-shadow: 0 0 0 4px ' + c.accentSoft
        : 'width: 8px; height: 8px; margin: 4px; border-radius: 4px; background: ' + (state === 'done' ? c.text : c.border);
      return { p, dotSt, labSt: 'font-size: 11px; color: ' + (state === 'now' ? c.accent + '; font-weight: 600' : c.muted) };
    });
    const reps = Array.from({ length: 10 }, (_, i) => ({ st: 'width: 12px; height: 4px; border-radius: 2px; background: ' + (i < 7 ? c.text : c.border) }));
    return { c, steps, reps };
  }
}
</script>
</body>
</html>

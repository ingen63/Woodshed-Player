<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Fokus Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0066D6}a:hover{color:#004FA8}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-feature-settings: 'tnum'; overflow: hidden">

  <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; padding-left: 14px; border-bottom: 1px solid {{c.border}}">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: {{c.muted}}">
      <div style="width: 14px; height: 14px; border-radius: 4px; background: {{c.accentFill}}"></div>Woodshed Player
    </div>
    <div style="flex: 1"></div>
    <button style="height: 24px; padding: 0 10px; margin-right: 10px; border-radius: 12px; border: 1px solid {{c.border}}; background: transparent; color: {{c.muted}}; font-size: 12px; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #E5484D"></span>Aufnahme</button>
    <button aria-label="Minimieren" style="width: 46px; height: 36px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"></path></svg></button>
    <button aria-label="Maximieren" style="width: 46px; height: 36px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"></rect></svg></button>
    <button aria-label="Schliessen" style="width: 46px; height: 36px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></button>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">
    <div style="width: 248px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 24px 16px; border-right: 1px solid {{c.border}}">
      <div style="font-size: 12px; color: {{c.muted}}; padding: 0 8px 10px">Bibliothek</div>
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="7">
        <div style="{{t.rowSt}}">
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
          <div style="height: 2px; border-radius: 1px; background: {{c.border}}; position: relative"><div style="{{t.loopSt}}"></div></div>
        </div>
      </sc-for>
      <div style="margin-top: auto; padding: 0 8px; font-size: 12px; color: {{c.muted}}">Ctrl+O zum Öffnen oder Dateien hineinziehen</div>
    </div>

    <div style="flex: 1; min-width: 0; display: flex; justify-content: center; padding: 56px 24px 32px">
      <div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 28px">
        <div style="font-size: 15px; color: {{c.muted}}">Kupferblues · Trio Feldweg</div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <div style="font-size: 120px; font-weight: 300; line-height: 1; letter-spacing: -0.03em">75<span style="font-size: 56px; color: {{c.muted}}"> %</span></div>
          <div style="font-size: 14px; color: {{c.muted}}">vom Originaltempo · 0,75×</div>
        </div>

        <div style="width: 100%; display: flex; justify-content: space-between">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 44px">
              <div style="{{s.dotSt}}"></div>
              <span style="{{s.labSt}}">{{s.p}}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 12px">
          <div style="display: flex; gap: 4px">
            <sc-for list="{{reps}}" as="r" hint-placeholder-count="10"><div style="{{r.st}}"></div></sc-for>
          </div>
          <span style="color: {{c.muted}}">Durchgang 7 von 10, dann 80 %</span>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
          <div style="height: 4px; border-radius: 2px; background: {{c.surface}}; position: relative">
            <div style="position: absolute; left: 18.4%; width: 7.3%; top: -4px; bottom: -4px; border-radius: 6px; background: {{c.accentFill}}"></div>
            <div style="position: absolute; left: 22.5%; top: -10px; bottom: -10px; width: 2px; background: {{c.text}}"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{c.muted}}"><span>0:00</span><span>3:48</span></div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
          <button style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px">Loop 0:42.0 – 0:58.5</button>
          <button style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px">96 BPM · 4/4</button>
          <button style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px">+5 % alle 10 Durchgänge</button>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; margin-top: auto">
          <button aria-label="Abspielen" style="width: 52px; height: 52px; border-radius: 26px; border: 1.5px solid {{c.text}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"></path></svg></button>
          <span style="font-size: 12px; color: {{c.muted}}">Leertaste · Ctrl+S / Ctrl+E setzt den Loop · Ctrl+↑ nächste Stufe</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dunkel":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dunkel ?? false;
    const c = dark
      ? { bg: '#000000', surface: '#1C1C1E', border: '#2C2C2E', text: '#F5F5F7', muted: '#A1A1A6', accent: '#3D9BFF', accentFill: '#0A84FF', accentSoft: 'rgba(10,132,255,0.22)' }
      : { bg: '#FFFFFF', surface: '#F5F5F7', border: '#E5E5EA', text: '#1D1D1F', muted: '#6E6E73', accent: '#0066D6', accentFill: '#007AFF', accentSoft: 'rgba(0,122,255,0.12)' };
    const tracks = [
      ['Kupferblues', 18, 7, true], ['Laternenwalzer', 40, 15, false], ['Etüde Nr. 4 in A-Moll', 0, 0, false],
      ['Nachtzug nach Lyon', 60, 12, false], ['Ruby Steps', 0, 0, false], ['Arpeggio-Übung 14', 0, 100, false], ['Morgenrot Bossa', 22, 20, false]
    ].map(([title, a, w, active]) => ({
      title,
      rowSt: 'display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px; ' + (active ? 'background: ' + c.surface + '; font-weight: 500' : 'color: ' + c.text),
      loopSt: w ? 'position: absolute; top: 0; bottom: 0; left: ' + a + '%; width: ' + w + '%; border-radius: 1px; background: ' + c.accentFill : 'display: none'
    }));
    const steps = [60, 65, 70, 75, 80, 85, 90, 95, 100].map((p) => {
      const state = p < 75 ? 'done' : p === 75 ? 'now' : 'todo';
      const dotSt = state === 'now'
        ? 'width: 18px; height: 18px; border-radius: 9px; background: ' + c.accentFill + '; box-shadow: 0 0 0 4px ' + c.accentSoft
        : 'width: 10px; height: 10px; margin: 4px; border-radius: 5px; background: ' + (state === 'done' ? c.text : c.border);
      return { p, dotSt, labSt: 'font-size: 12px; color: ' + (state === 'now' ? c.accent + '; font-weight: 600' : c.muted) };
    });
    const reps = Array.from({ length: 10 }, (_, i) => ({ st: 'width: 14px; height: 4px; border-radius: 2px; background: ' + (i < 7 ? c.text : c.border) }));
    return { c, tracks, steps, reps };
  }
}
</script>
</body>
</html>

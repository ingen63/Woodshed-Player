<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>A Studio Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF9F0A}a:hover{color:#FFB340}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 20px; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 8px; height: 56px">
    <button aria-label="Zurück zur Bibliothek" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"></path></svg></button>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 17px; font-weight: 600">Kupferblues</div>
      <div style="font-size: 12px; color: {{c.muted}}">Trio Feldweg · 00:51 / 03:48</div>
    </div>
    <button aria-label="Mehr" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"></circle><circle cx="12" cy="12" r="2" fill="currentColor"></circle><circle cx="12" cy="19" r="2" fill="currentColor"></circle></svg></button>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 10px 10px 18px; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 16px; display: flex; align-items: center; gap: 1px; position: relative">
      <sc-for list="{{mini}}" as="b" hint-placeholder-count="70"><div style="{{b.st}}"></div></sc-for>
      <div style="position: absolute; left: 15.8%; width: 13.1%; top: -2px; bottom: -2px; border: 1px solid {{c.text}}; border-radius: 3px"></div>
    </div>
    <div style="height: 130px; position: relative; display: flex; align-items: center; gap: 2px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="64"><div style="{{b.st}}"></div></sc-for>
      <div style="position: absolute; left: 20%; width: 55%; top: 0; bottom: 0; background: {{c.amberSoft}}; border-left: 2px solid {{c.amber}}; border-right: 2px solid {{c.amber}}"></div>
      <div style="position: absolute; left: calc(20% - 18px); bottom: -14px; width: 36px; height: 36px; border-radius: 8px; background: {{c.amber}}; color: #121214; font-weight: 700; display: flex; align-items: center; justify-content: center">S</div>
      <div style="position: absolute; left: calc(75% - 18px); bottom: -14px; width: 36px; height: 36px; border-radius: 8px; background: {{c.amber}}; color: #121214; font-weight: 700; display: flex; align-items: center; justify-content: center">E</div>
      <div style="position: absolute; left: 51%; top: 0; bottom: 0; width: 2px; background: {{c.text}}"></div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 0">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600"><span style="color: {{c.amber}}">LOOP</span> 00:42.0 → 00:58.5</span>
    <span style="color: {{c.muted}}">7 / 10</span>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1; color: {{c.amber}}">0,75×</span>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: {{c.muted}}">TEMPO</span>
    </div>
    <div style="position: relative; height: 40px; display: flex; align-items: center">
      <div style="flex: 1; height: 6px; border-radius: 3px; background: {{c.border}}"></div>
      <div style="position: absolute; left: 0; width: 34%; height: 6px; border-radius: 3px; background: {{c.amber}}"></div>
      <div style="position: absolute; left: calc(34% - 13px); width: 26px; height: 26px; border-radius: 13px; background: {{c.text}}"></div>
    </div>
    <div style="display: flex; gap: 4px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
        <div style="{{s.st}}">{{s.p}}</div>
      </sc-for>
    </div>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600; color: {{c.blue}}">96</span>
    <span style="color: {{c.muted}}">BPM · 4/4</span>
    <div style="flex: 1; display: flex; gap: 5px">
      <div style="flex: 1; height: 10px; border-radius: 3px; background: {{c.blue}}"></div>
      <div style="flex: 1; height: 10px; border-radius: 3px; background: {{c.led}}"></div>
      <div style="flex: 1; height: 10px; border-radius: 3px; background: {{c.led}}"></div>
      <div style="flex: 1; height: 10px; border-radius: 3px; background: {{c.led}}"></div>
    </div>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px">
    <button style="height: 56px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; font-size: 15px; font-weight: 600">S hier</button>
    <button aria-label="Abspielen" style="height: 56px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"></path></svg></button>
    <button style="height: 56px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; font-size: 15px; font-weight: 600">E hier</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dunkel":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dunkel ?? true;
    const c = dark
      ? { bg: '#121214', panel: '#1C1C1F', panel2: '#26262A', border: '#2C2C30', text: '#ECECEF', muted: '#9A9AA3', amber: '#FF9F0A', amberSoft: 'rgba(255,159,10,0.16)', blue: '#4DA3FF', wave: '#4A4A52', led: '#2C2C30' }
      : { bg: '#ECECEF', panel: '#FFFFFF', panel2: '#F4F4F6', border: '#D4D4D9', text: '#18181B', muted: '#5A5A63', amber: '#A85F00', amberSoft: 'rgba(255,159,10,0.18)', blue: '#0A63C2', wave: '#B9B9C0', led: '#D4D4D9' };
    const gen = (n, seed, loopA, loopB, minH) => {
      const out = []; let s = seed;
      for (let i = 0; i < n; i++) {
        s = (s * 9301 + 49297) % 233280;
        const r = s / 233280;
        const env = 0.35 + 0.65 * Math.abs(Math.sin(i / n * Math.PI * 2.6 + 0.4));
        const h = Math.max(minH, Math.round((0.2 + 0.8 * r) * env * 100));
        const f = i / n;
        out.push({ st: 'flex: 1 1 0; height: ' + h + '%; border-radius: 1px; background: ' + (f >= loopA && f < loopB ? c.amber : c.wave) });
      }
      return out;
    };
    const steps = [60, 65, 70, 75, 80, 85, 90, 95, 100].map((p) => {
      const state = p < 75 ? 'done' : p === 75 ? 'now' : 'todo';
      const bg = state === 'todo' ? c.panel2 : state === 'now' ? c.amber : c.amberSoft;
      const fg = state === 'now' ? '#121214' : state === 'done' ? c.text : c.muted;
      return { p, st: "flex: 1; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; background: " + bg + '; color: ' + fg };
    });
    return { c, steps, bars: gen(64, 7, 0.2, 0.75, 4), mini: gen(70, 3, 0.184, 0.257, 10) };
  }
}
</script>
</body>
</html>

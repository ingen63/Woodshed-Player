<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>C Woodshed Tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#E0714F}a:hover{color:#F08A6A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 20px 28px 32px; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px">
    <button style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; font-size: 15px">Notenregal</button>
    <div style="flex: 1"></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px">0:51.3 / 3:48</div>
  </div>

  <div>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600">Kupferblues</h1>
    <div style="color: {{c.muted}}">Trio Feldweg</div>
  </div>

  <div style="position: relative; height: 200px; border-radius: 12px; background: {{c.panel}}; border: 1px solid {{c.border}}; padding: 0 28px; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <div style="position: relative; height: 84px; border-radius: 3px; background: {{c.tape}}; border-top: 2px solid {{c.tapeLine}}; border-bottom: 2px solid {{c.tapeLine}}; display: flex; align-items: center; gap: 2px; padding: 0 4px; box-sizing: border-box">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="90"><div style="{{b.st}}"></div></sc-for>
      <div style="position: absolute; left: 20%; width: 55%; top: 0; bottom: 0; background: {{c.terraSoft}}"></div>
      <div style="position: absolute; left: calc(20% - 14px); top: -26px; bottom: -26px; width: 28px; border-radius: 4px; background: {{c.brass}}; display: flex; align-items: flex-start; justify-content: center; color: {{c.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; padding-top: 4px; box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.35)">S</div>
      <div style="position: absolute; left: calc(75% - 14px); top: -26px; bottom: -26px; width: 28px; border-radius: 4px; background: {{c.brass}}; display: flex; align-items: flex-start; justify-content: center; color: {{c.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; padding-top: 4px; box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.35)">E</div>
      <div style="position: absolute; left: 51%; top: -12px; bottom: -12px; width: 2px; background: {{c.terra}}"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{c.muted}}"><span>0:36</span><span>Loop 0:42.0 → 0:58.5 (Ausschnitt)</span><span>1:06</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <button style="height: 52px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; font-size: 16px">S hier</button>
    <button style="height: 52px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel}}; color: {{c.text}}; font-size: 16px">E hier</button>
    <button style="height: 52px; border-radius: 8px; border: 1px solid {{c.brass}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 16px; font-weight: 600">Loop an</button>
  </div>

  <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: {{c.muted}}">TEMPO</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 60px; font-weight: 600; line-height: 1">0,75×</span>
    </div>
    <div style="position: relative; height: 72px">
      <div style="position: absolute; left: 0; right: 0; top: 26px; height: 10px; border-radius: 5px; background: {{c.bg}}; box-shadow: inset 0 1px 3px rgba(0,0,0,0.4)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 50px; display: flex; justify-content: space-between">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="11"><div style="{{t.st}}"></div></sc-for>
      </div>
      <div style="position: absolute; left: calc(50% - 20px); top: 4px; width: 40px; height: 54px; border-radius: 5px; background: {{c.brass}}; box-shadow: 0 3px 8px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center"><div style="width: 26px; height: 2px; background: {{c.bg}}"></div></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{c.muted}}"><span>0,5</span><span>0,6</span><span>0,7</span><span>0,8</span><span>0,9</span><span>1,0</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: {{c.muted}}">DURCHGÄNGE</span>
      <div style="display: flex; align-items: center; gap: 20px; height: 52px">
        <div style="position: relative; display: flex; gap: 7px">
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="position: absolute; left: -5px; top: 21px; width: 46px; height: 4px; border-radius: 2px; background: {{c.text}}; transform: rotate(-28deg)"></div>
        </div>
        <div style="display: flex; gap: 7px">
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.text}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.border}}"></div>
          <div style="width: 4px; height: 46px; border-radius: 2px; background: {{c.border}}"></div>
        </div>
      </div>
      <div style="color: {{c.muted}}">7 von 10 · dann <b style="color: {{c.sage}}">80 %</b></div>
      <div style="display: flex; gap: 4px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="9"><div style="{{s.st}}"></div></sc-for>
      </div>
    </div>
    <div style="background: {{c.panel}}; border: 1px solid {{c.border}}; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; color: {{c.muted}}">METRONOM</span>
      <div style="display: flex; gap: 14px">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: {{c.terra}}; box-shadow: 0 0 14px {{c.terra}}"></div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: {{c.ledOff}}"></div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: {{c.ledOff}}"></div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: {{c.ledOff}}"></div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600">96</span><span style="color: {{c.muted}}">BPM · 4/4</span></div>
      <button style="height: 48px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; font-size: 16px">Tap</button>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: center">
    <button aria-label="Abspielen" style="width: 72px; height: 52px; border-radius: 8px; border: 1px solid {{c.border}}; background: {{c.panel2}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dunkel":{"editor":"boolean","default":true},"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dunkel ?? true;
    const c = dark
      ? { bg: '#1E1916', panel: '#2A221D', panel2: '#352B24', border: '#4A3C32', text: '#F1E8DC', muted: '#B9A994', terra: '#E0714F', terraSoft: 'rgba(224,113,79,0.22)', sage: '#8FB39E', brass: '#C9A45C', tape: '#3A2E26', tapeLine: '#4D3E33', wave: '#6B5A4C', ledOff: '#3F332B' }
      : { bg: '#F4F1EA', panel: '#FBF9F4', panel2: '#EFE9DD', border: '#DDD4C4', text: '#2B231E', muted: '#6B5D50', terra: '#B8492A', terraSoft: 'rgba(217,93,57,0.18)', sage: '#4A6B5A', brass: '#A8803A', tape: '#E6DFD1', tapeLine: '#D2C8B6', wave: '#B5A894', ledOff: '#DDD4C4' };
    const bars = []; let s = 11;
    for (let i = 0; i < 90; i++) {
      s = (s * 9301 + 49297) % 233280;
      const r = s / 233280;
      const env = 0.35 + 0.65 * Math.abs(Math.sin(i / 90 * Math.PI * 2.6 + 0.4));
      const f = i / 90;
      bars.push({ st: 'flex: 1 1 0; height: ' + Math.max(6, Math.round((0.2 + 0.8 * r) * env * 80)) + '%; border-radius: 1px; background: ' + (f >= 0.2 && f < 0.75 ? c.terra : c.wave) });
    }
    const ticks = Array.from({ length: 11 }, (_, i) => ({ st: 'width: 2px; height: ' + (i % 2 === 0 ? 16 : 9) + 'px; background: ' + c.muted }));
    const steps = [60, 65, 70, 75, 80, 85, 90, 95, 100].map((p) => ({ st: 'flex: 1; height: 10px; border-radius: 2px; background: ' + (p < 75 ? c.sage : p === 75 ? c.terra : c.ledOff) }));
    return { c, bars, ticks, steps };
  }
}
</script>
</body>
</html>

# Machbarkeitstest W0 (#32): prüft den WASM-Kern und veröffentlicht die Testseite web/w0/ auf GitHub Pages.
# Die Datei w0.wasm liegt gebaut im Repo (core/web/build_w0.sh), damit hier kein Emscripten nötig ist.
# Einmalig nötig: Repo → Settings → Pages → Source «GitHub Actions».
name: W0-Testseite

on:
  push:
    branches: [main]
    paths: ['web/**', 'core/web/**', '.github/workflows/w0-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASM-Kern prüfen (#32/AK3)
        run: node core/web/w0_test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

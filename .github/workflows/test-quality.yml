# Test quality (#57, #10, #58, #13). Strategy, runs and estimates: docs/TESTS.md «GitHub-Workflow (#13)».
# On every push to main (Linux runners only):
# - checks: format, lint, tests and coverage (minimum from tools/coverage-min) of the core and the Dart
#   code, with coverage, coverage-diff and the overview page in the run summary; when the push changes
#   code (core/, app/, tools/, Makefile, the workflows); actionlint on every workflow (#64); the overview page of #12 as an artifact.
# - web: WASM core, web tests in Chrome (OPFS, WASM binding) and `flutter build web`; when the push
#   changes web code (web files, *_web.dart, the core, the web build).
# - sanitize: AddressSanitizer and UndefinedBehaviorSanitizer (make sanitize, #57); when core/ changes.
# - contract: contract native <-> WASM (#77, #9/AK7): the native reference_tests write their samples,
#   then the WASM core under Node.js compares (tolerance 1e-6, every C API function) and replays the
#   fuzz regressions and start corpus (#67); when core/ changes.
# - network-free: the network check (make network-free, #58); every push, whatever it changes.
# Nightly (02:17 UTC), only if main has a new commit since the last successful nightly run:
# - macos: macOS and iOS build, UI tests (integration_test) on macOS and the iOS simulator (#99) and
#   smoke test of the built app (#13).
# - sanitize-thread: ThreadSanitizer (#57). fuzz: libFuzzer on decoder and C API (#10), then every
#   input of the night (regressions, start corpus, grown corpus) against the WASM core (#67).
# - property: Dart random tests with many cases and a new seed (#10).
# - bench: performance and load tests of core and library (make bench, #59), values in the run summary.
# - mutants-diff: mutation tests (Mull for the core, own mutator for the Dart logic) of the lines changed
#   since the last successful nightly run (#11); a not detected mutant fails the job.
# By hand (workflow_dispatch): the push jobs; with nightly=true also every nightly job, gate or not.
# Nightly runs have their own concurrency group: a push never cancels them (#13/AK8).
# The checks for changed paths live in the job «changes».
# #125: a job that provides a resource sets its WP_<RESOURCE>_REQUIRED to 1, so a test that needs it
# fails instead of being skipped (checks: Python, actionlint; macos: core library, audio device on the
# null device; bench: optimized build). docs/TESTS.md «Pflicht-Variablen (#125)».
name: Test quality

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'  # nightly, 02:17 UTC
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Also run every nightly job (macOS/iOS, UI tests, app smoke test, TSan, fuzzing, random tests, mutation tests)'
        type: boolean
        default: false

permissions:
  contents: read

# #13/AK8: nightly runs (schedule, or by hand with nightly=true) share the group «nightly» and are never
# cancelled; a push only cancels an older run of the same kind on the same branch.
concurrency:
  group: >-
    test-quality-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly'
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FLUTTER_VERSION: 3.50.0  # same as pages.yml and the developers' machines (dart format depends on it)
  LLVM_TOOLS_VERSION: '23.*'  # clang-format and clang-tidy as on the developers' machines (Homebrew llvm)
  ACTIONLINT_VERSION: 1.7.12  # as on the developers' machines (Homebrew actionlint), docs/TESTS.md
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # linux_amd64 archive
  EMSDK_VERSION: 7.0.0  # Emscripten of the jobs contract (#77), fuzz and web (#79), same as pages.yml and the developers' machines (Homebrew emscripten), docs/TESTS.md

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Paths changed by the push
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # new branch or unknown base: run everything
            printf 'core=true\ncode=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          has() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            echo "core=$(has '^(core/|Makefile$|\.github/workflows/test-quality\.yml$)')"
            echo "code=$(has '^(core/|app/|tools/|Makefile$|\.github/workflows/|CHANGELOG(\.en)?\.md$)')"
            echo "web=$(has '^(app/web/|app/lib/.*_web\.dart$|app/test/web/|app/tool/build_web_core\.sh$|app/pubspec\.(yaml|lock)$|core/(src|include|web)/|tools/chrome_autoplay\.sh$|Makefile$|\.github/workflows/test-quality\.yml$)')"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Format, lint, tests, coverage (Linux, #13)
    needs: changes
    # after «changes» on push, and on manual start (then «changes» is skipped)
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read  # the overview page (#12) reads issues and comments via gh
    env:
      CC: clang-18
      CXX: clang++-18
      LLVM_COV: llvm-cov-18
      LLVM_PROFDATA: llvm-profdata-18
      WP_PYTHON_REQUIRED: '1'  # #125: site build tests (about_test, web_hosting_test)
      WP_ACTIONLINT_REQUIRED: '1'  # #125: installed below, test_quality_workflow_test #64/AK4
      WP_LAME_REQUIRED: '1'  # #125, #141: built below, core/tests/mp3_export_tests.cpp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # coverage-diff compares with the commit before the push
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: LLVM tools (clang-format, clang-tidy, llvm-cov)
        run: |
          # llvm-cov/llvm-profdata match the compiler (clang-18); run-clang-tidy-18 only drives the
          # clang-tidy binary named by the Makefile.
          sudo apt-get install -y -qq llvm-18 clang-tidy-18 >/dev/null
          pipx install "clang-format==$LLVM_TOOLS_VERSION"
          pipx install "clang-tidy==$LLVM_TOOLS_VERSION"
          bin=$(pipx environment --value PIPX_BIN_DIR)
          {
            echo "CLANG_FORMAT=$bin/clang-format"
            echo "CLANG_TIDY=$bin/clang-tidy"
            echo "RUN_TIDY=run-clang-tidy-18"
          } >> "$GITHUB_ENV"
          "$bin/clang-format" --version
          "$bin/clang-tidy" --version | head -1
      - name: actionlint (#64), fixed version with checksum
        run: |
          # actionlint also runs ShellCheck on the run: scripts; the Ubuntu runners have it preinstalled
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c --quiet
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "ACTIONLINT=$RUNNER_TEMP/actionlint/actionlint" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/actionlint/actionlint" --version | head -1
          shellcheck --version | sed -n 2p
      - name: Packages
        run: |
          (cd app && flutter pub get >/dev/null)
          (cd app/packages/wp_core && flutter pub get >/dev/null)
      - name: LAME for the MP3 export tests, from its source (#141/AK15)
        run: tools/build-lame.sh
      - name: make format-check (#7/AK2)
        run: make format-check
      - name: make test-changelog (release notes in both languages, #139/AK6)
        run: make test-changelog
      - name: make lint (#7/AK3, actionlint #64)
        run: make lint
      - name: make coverage (tests of core and app with coverage, #8)
        id: coverage
        run: |
          set -o pipefail
          make coverage-run
          dart app/tool/coverage_check.dart | tee coverage-check.txt
      - name: coverage-diff (#8/AK3, a hint)
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          dart app/tool/coverage_diff.dart --base "$base" | tee coverage-diff.txt || true
      - name: Overview page (#12)
        id: report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # JUnit and coverage of the steps above; mutation runs are separate jobs (no data here).
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          make -s report REPORT_ARGS="--base $base --summary" > report-summary.md
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Overview page as artifact (#13/AK9, #12)
        if: ${{ !cancelled() && steps.report.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-quality-report
          path: |
            local/test-quality/report/
            local/test-quality/junit/
          if-no-files-found: ignore
      - name: Coverage data as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            app/coverage/lcov.info
            core/build-cov/lcov.info
          if-no-files-found: ignore
      - name: Run summary (#13/AK9)
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ steps.report.outputs.available }}
        run: |
          {
            echo "## Coverage per part (tools/coverage-min)"
            echo '```'
            cat coverage-check.txt 2>/dev/null || echo "no coverage data (an earlier step failed)"
            echo '```'
            echo "## coverage-diff (changed lines, a hint)"
            echo '```'
            cat coverage-diff.txt 2>/dev/null || echo "no coverage-diff"
            echo '```'
            echo "## Overview page"
            if [ "$REPORT" = "true" ]; then
              cat report-summary.md
              echo
              echo "Artifact **test-quality-report** (report/index.html, junit/)."
            else
              echo "No overview page (make report failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web build and web tests in Chrome (#13/AK4)
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.web == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Emscripten from the cache (#89)
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emsdk
          # a new EMSDK_VERSION gives a new key, so the next run installs it afresh
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten (fixed version, #79)
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION" >/dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION" >/dev/null
      # make test-web ends with make test-web-start, which builds the web app in release mode once
      # and starts it in Chrome (#72); no build step of its own (#83)
      - name: make test-web (WASM core, OPFS, binding in Chrome, release build and start)
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          cd app && flutter pub get >/dev/null && cd ..
          make test-web

  sanitize:
    name: ASan and UBSan (core)
    needs: changes
    # runs after «changes» on push, and on manual start (then «changes» is skipped)
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.core == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Address space layout for the sanitizers
        # newer Ubuntu kernels use more ASLR bits than the sanitizer runtimes of older clang accept
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: make sanitize (#57/AK1)
        run: make sanitize

  contract:
    name: Contract native and WASM (#77)
    needs: changes
    # after «changes» on push, and on manual start (then «changes» is skipped)
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.core == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Emscripten from the cache (#89)
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emsdk
          # a new EMSDK_VERSION gives a new key, so the next run installs it afresh
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten (fixed version)
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION" >/dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION" >/dev/null
      - name: Native reference cases write their samples (#77/AK1)
        run: make reference-native
      - name: WASM core under Node.js compares with the native samples (#77/AK1, AK2)
        # a deviation above 1e-6 fails reference_tests, a C API function without a reference case
        # fails reference_api_coverage
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          emcc --version | head -1
          make test-wasm-compare

  network-free:
    name: Network freedom (#58)
    # every push, no path filter: any file can bring network code; and on manual start
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: make network-free (#58/AK6)
        run: make network-free

  nightly-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: New commit since the last successful nightly run?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test-quality.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No new commit since $last, nightly jobs skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS and iOS build, UI tests, app smoke test (#13, #99)
    needs: nightly-gate
    # nightly after the gate, and by hand with nightly=true (then the gate is skipped)
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # GitHub's macOS runners have no audio device: the core plays to its silent null device at
      # real-time pace (core/src/player.cpp), on macOS and in the iOS simulator. Locally the tests use
      # the real device.
      WP_AUDIO_BACKEND: 'null'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Packages
        working-directory: app
        run: flutter pub get >/dev/null
      - name: LAME, the MP3 encoder the app carries (#141/AK15)
        # universal library from its source with a fixed version and checksum; the app's build phase
        # «Embed LAME» puts it into Contents/Frameworks
        run: tools/build-lame.sh
      - name: FFI tests against the core library (#125/AK4, #116/AK4, #28/AK6, #141)
        # the push runs flutter test on Linux, where these tests are skipped; here they must run
        env:
          WP_MACOS_CORE_REQUIRED: '1'
          WP_AUDIO_DEVICE_REQUIRED: '1'  # the null device above
          WP_LAME_REQUIRED: '1'  # built above
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build core/build -j 4 --target wp_core 2>&1 | tail -20
          cd app && flutter test --reporter expanded test/wp_trim_ffi_test.dart test/wp_waveform_ffi_test.dart test/mp3_ffi_test.dart
      - name: macOS build (debug)
        working-directory: app
        run: flutter build macos --debug
      - name: iOS build (simulator, debug)
        working-directory: app
        run: flutter build ios --simulator --debug
      - name: UI tests (#13/AK1, AK2, AK7)
        working-directory: app
        run: flutter test integration_test -d macos --reporter expanded
      - name: UI smoke test on the iOS simulator (#99/AK1, AK3, AK4)
        # the real core on an iOS simulator (booted by the script, null device as above), including the
        # check that recording is missing on iPhone/iPad (#4/AK6)
        run: make test-ios
      - name: Smoke test of the built app (#13/AK5)
        run: |
          (cd app && flutter build macos --release)
          tools/smoke_app.sh

  sanitize-thread:
    name: TSan (core)
    needs: nightly-gate
    # nightly after the gate, and by hand with nightly=true (then the gate is skipped)
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Address space layout for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: make sanitize-thread (#57/AK2)
        run: make sanitize-thread

  fuzz:
    name: Fuzzing (core, #10)
    needs: nightly-gate
    # nightly after the gate, and by hand with nightly=true (then the gate is skipped)
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Address space layout for the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Corpus of earlier nights (not checked in)
        uses: actions/cache@v6
        with:
          path: core/build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: make fuzz (#10/AK4, AK9), 20 min per target
        id: native
        run: make fuzz FUZZ_SECONDS=1200
      # #88: the WASM steps also run after a native finding; the failed native step keeps the job red
      - name: Emscripten from the cache (#89)
        if: ${{ !cancelled() }}
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emsdk
          # a new EMSDK_VERSION gives a new key, so the next run installs it afresh
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten (fixed version)
        if: ${{ !cancelled() && steps.emsdk.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION" >/dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION" >/dev/null
      - name: The same inputs against the WASM core under Node.js (#67/AK1-AK3)
        # regressions, start corpus and the corpus grown by make fuzz (this night and earlier ones)
        if: steps.native.outcome == 'success'
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          make fuzz-wasm
      - name: Inputs of the native finding against the WASM core (#88/AK1, AK2)
        # one line per input of core/build-fuzz/artifacts/: finding under WASM yes or no
        if: ${{ !cancelled() && steps.native.outcome == 'failure' }}
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          make fuzz-wasm-findings
      - name: Inputs of the finding
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            core/build-fuzz/artifacts/
            core/build-fuzz/fuzz_*.log
            core/build-wasm/fuzz_*_replay.log
            core/build-wasm/fuzz_findings_wasm.txt
            core/build-wasm/fuzz_*_finding_*.log
          if-no-files-found: ignore

  property:
    name: Random tests (app, #10)
    needs: nightly-gate
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Random tests with many cases and a new seed (#10/AK1, AK6)
        # The seed is printed by every test; repeat a failure locally with the same WP_PROPERTY_SEED.
        run: make property PROPERTY_CASES=3000 PROPERTY_SEED=${{ github.run_id }}

  bench:
    name: Performance and load tests (#59)
    needs: nightly-gate
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      WP_OPTIMIZED_BUILD_REQUIRED: '1'  # #125: make bench builds Release, the time limits must run
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Packages
        working-directory: app
        run: flutter pub get >/dev/null
      - name: make bench (#59/AK1-AK4)
        run: make bench
      - name: Measured values with machine and date (#59/AK5)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Performance and load tests (#59)"
            echo "$(date -u +%Y-%m-%d), $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs," \
              "$(free -g | awk '/^Mem:/ {print $2}') GB RAM, ${{ runner.os }} ${{ runner.arch }}"
            echo '```'
            cat core/build-bench/bench.txt 2>/dev/null || echo "no values (an earlier step failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutants-diff:
    name: Mutation tests of the changed lines (#11)
    needs: nightly-gate
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.nightly)
      || (github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true'))
    # the Mull package is built for Ubuntu 24.04 and LLVM 18
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      MULL_VERSION: 0.39.1
      MULL_CC: clang-18
      MULL_CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Packages
        working-directory: app
        run: flutter pub get >/dev/null
      - name: Address space layout for the sanitizers (the mutation build uses ASan and UBSan)
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Install Mull (Apache-2.0, a tool only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$MULL_VERSION" --repo mull-project/mull \
            --pattern "Mull-$MULL_VERSION-ubuntu-amd64-24.04.deb" \
            --pattern "Mull-18-$MULL_VERSION-LLVM-18.1.3-ubuntu-amd64-24.04.deb"
          sudo apt-get install -y -qq ./Mull-*.deb >/dev/null
          {
            echo "MULL_RUNNER=$(command -v mull-runner-18 || command -v mull-runner)"
            echo "MULL_PLUGIN=$(dpkg -L mull-18 | grep 'mull-ir-frontend-18$')"
          } >> "$GITHUB_ENV"
      - name: Base (last successful nightly run, at most 3 days back)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test-quality.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          oldest=$(git rev-list -1 --before='3 days ago' HEAD || true)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
             && { [ -z "$oldest" ] || git merge-base --is-ancestor "$oldest" "$last"; }; then
            base="$last"
          else
            base=$(git rev-list -1 --before='24 hours ago' HEAD || true)
            [ -n "$base" ] || base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base: $base"
      - name: make mutants-diff (#11/AK1, AK5)
        run: make mutants-diff BASE=${{ steps.base.outputs.base }} MUTANTS_JOBS=4
      - name: Not detected mutants in the run summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Mutation tests of the changed lines (#11)"
            echo "Base: \`${{ steps.base.outputs.base }}\`"
            echo '```'
            cat local/mutants/diff/summary.txt 2>/dev/null || echo "no results (an earlier step failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Results as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutants-diff
          path: |
            local/mutants/diff/summary.txt
            local/mutants/diff/missed.txt
            local/mutants/diff/results.json
            local/mutants/diff/core/*.log
          if-no-files-found: ignore

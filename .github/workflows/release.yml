# Release (#139): a version tag (v0.9.0) builds the installation packages and creates a release draft on
# GitHub with them and the release notes of that version. The draft is published by hand («Publish»).
# - notes: checks CHANGELOG.md and CHANGELOG.en.md (tools/changelog.py), that both languages have the tag's
#   version and that the tag equals the version in app/pubspec.yaml; otherwise no package is built.
# - macos: universal app (arm64 and x86_64), ad hoc signed, not notarised (no Apple developer account), as
#   WoodshedPlayer-<version>-macos.dmg; with LAME for the MP3 export (#141).
# - web: the web app as WoodshedPlayer-<version>-web.zip, built like the app on GitHub Pages (pages.yml: same
#   tag, WASM core, tests, flutter build web flags, offline stamp) but for the root of a web server
#   (--base-href /).
# - windows, linux (#60): x64 only, as WoodshedPlayer-<version>-windows.zip and -linux.tar.gz; the program,
#   the core library, the command line and the licence texts. Not signed (Windows SmartScreen warns, README
#   «Installation»); Linux needs GTK 3 of the system (licenses/SYSTEM-LIBRARIES.txt).
# - release: only when every package job succeeded; otherwise there is no draft and the red job names the
#   platform. Title «Woodshed Player <version>», text from tools/changelog.py (English open, German folded).
# Only GitHub-hosted runners. Secrets: the run's own GITHUB_TOKEN and, for the Windows and Linux builds only,
# WP_GOOGLE_DESKTOP_SECRET (#164), the «secret» of Google's desktop client for the sign-in; it is passed as an
# environment variable to --dart-define, never written to a file or the log. By hand: Actions › Release › Run workflow with an existing tag (rebuilds its
# packages into its release; an existing release keeps its text).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.9.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  FLUTTER_VERSION: 3.50.0  # same as test-quality.yml and pages.yml
  EMSDK_VERSION: 7.0.0  # same as test-quality.yml and pages.yml (#79)

jobs:
  notes:
    name: Release notes and version (#139/AK5, AK7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check both changelogs (#139/AK6)
        run: python3 tools/changelog.py check
      - name: Version of the tag in both languages (#139/AK7)
        # names the file and the language that lacks the version; no package is built then
        run: python3 tools/changelog.py notes "$TAG" -o "$RUNNER_TEMP/release-notes.md"
      - name: Tag, app version and title (#139/AK4, AK8)
        id: version
        run: |
          version=$(python3 tools/changelog.py tag "$TAG")
          title=$(python3 tools/changelog.py title "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "### $title" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  macos:
    name: Package macOS (.dmg)
    needs: notes
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WP_LAME_REQUIRED: '1'  # the package must carry the MP3 encoder (#141)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # the build stamps the tag into the app (git describe, #139/AK4)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: LAME, the MP3 encoder the app carries (#141)
        run: tools/build-lame.sh
      - name: Build the app (release, universal)
        working-directory: app
        run: |
          flutter pub get >/dev/null
          flutter build macos --release
      - name: Check and pack (#139/AK2, AK3, AK4)
        run: tools/package.sh macos "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: dist/
          if-no-files-found: error
      - name: Name the platform (#139/AK10)
        if: failure()
        run: echo "::error title=macOS package failed::The macOS package of $TAG was not built; no release draft."

  web:
    name: Package web app (.zip)
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Emscripten from the cache (#89)
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten (fixed version, #79)
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION" >/dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION" >/dev/null
      - name: Build WASM core of the app (#33)
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          app/tool/build_web_core.sh
      - name: Test WASM core under Node.js (as pages.yml)
        run: node core/web/wp_core_web_test.mjs app/web/wp_core/wp_core_web.wasm core/tests/audio
      - name: Flutter tests (as pages.yml)
        working-directory: app
        run: |
          flutter pub get >/dev/null
          flutter test --reporter failures-only
      - name: Build web app (as pages.yml, for the root of a web server)
        working-directory: app
        run: |
          flutter build web --release --no-wasm-dry-run --base-href / \
            --dart-define=WP_GIT_TAG="$TAG" --dart-define=WP_BUILD_DATE="$(date -u +%Y-%m-%d)"
          dart run tool/stamp_sw.dart build/web
      - name: Check and pack (#139/AK2, AK3, AK4)
        run: tools/package.sh web "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-web
          path: dist/
          if-no-files-found: error
      - name: Name the platform (#139/AK10)
        if: failure()
        run: echo "::error title=Web package failed::The web package of $TAG was not built; no release draft."

  windows:
    name: Package Windows (.zip, #60)
    needs: notes
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # the build stamps the tag into the program (git describe, #139/AK4)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build the app (release, x64)
        working-directory: app
        env:
          WP_GOOGLE_DESKTOP_SECRET: ${{ secrets.WP_GOOGLE_DESKTOP_SECRET }}  # #164
        run: |
          flutter pub get >/dev/null
          flutter build windows --release --dart-define=WP_GOOGLE_DESKTOP_SECRET="$WP_GOOGLE_DESKTOP_SECRET"
      - name: Check and pack (#139/AK2, AK3, AK4)
        run: tools/package.sh windows "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: dist/
          if-no-files-found: error
      - name: Name the platform (#139/AK10)
        if: failure()
        run: echo "::error title=Windows package failed::The Windows package of $TAG was not built; no release draft."

  linux:
    name: Package Linux (.tar.gz, #60)
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # the build stamps the tag into the program (git describe, #139/AK4)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: GTK and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev >/dev/null
      - name: Build the app (release, x64)
        working-directory: app
        env:
          WP_GOOGLE_DESKTOP_SECRET: ${{ secrets.WP_GOOGLE_DESKTOP_SECRET }}  # #164
        run: |
          flutter pub get >/dev/null
          flutter build linux --release --dart-define=WP_GOOGLE_DESKTOP_SECRET="$WP_GOOGLE_DESKTOP_SECRET"
      - name: Check and pack (#139/AK2, AK3, AK4)
        run: tools/package.sh linux "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: dist/
          if-no-files-found: error
      - name: Name the platform (#139/AK10)
        if: failure()
        run: echo "::error title=Linux package failed::The Linux package of $TAG was not built; no release draft."

  release:
    name: Release draft (#139/AK1, AK8)
    # only when every package was built (#139/AK10): a failed or cancelled job skips this one
    needs: [notes, macos, web, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release draft
    steps:
      - name: Packages and release notes of this run
        uses: actions/download-artifact@v8
        with:
          path: artifacts  # one folder per artifact: release-notes, package-macos, -web, -windows, -linux
      - name: Packages into one folder
        run: |
          mkdir dist
          find artifacts -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' |
            while IFS= read -r file; do mv "$file" dist/; done
          ls -l dist
          test "$(find dist -type f | wc -l)" -eq 4
      - name: Create the draft, or update the packages of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.notes.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TITLE" \
              --notes-file artifacts/release-notes/release-notes.md dist/*
          fi
          echo "Release draft **$TITLE** with $(cd dist && printf '%s ' *)" >> "$GITHUB_STEP_SUMMARY"

# Test tags (#59). «bench»: performance and load tests in bench/, run nightly by `make bench`; `flutter test`
# without a path only runs test/ and never reaches them.
tags:
  bench:
    timeout: 5m
  # #60: checks of the repository's files, scripts and workflows (POSIX paths, shells, file modes);
  # the Windows job runs `flutter test --exclude-tags repo`, Linux and macOS run them.
  repo: {}

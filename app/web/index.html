<!DOCTYPE html>
<!-- Woodshed Player in the browser (#34). Audio core under wp_core/ (app/tool/build_web_core.sh).
     Published under /app/ on GitHub Pages (#41). Icons, manifest and phone use follow with W7 (#39). -->
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Content Security Policy (#58), checked by app/tool/network_free.dart (make network-free).
       connect-src: only the own origin and the API and sign-in hosts of the cloud providers (#38).
       script-src: own files, 'wasm-unsafe-eval' for CanvasKit and the audio core (WebAssembly), and the
       hash of the inline script below (change it there, the check names the new hash).
       style-src 'unsafe-inline': Flutter's engine writes <style> elements into the page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-tO1BHbXKqhtyFd7Fz1NeCCGo2Xixq0NOCEzHAuHjYNI='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="description" content="Practice player for musicians">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Woodshed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Woodshed Player</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Cross-origin isolation (#41/AK2): sw.js sets COOP/COEP. On the first visit the page itself was
    // loaded without the worker, so it reloads once; then Flutter starts. Without service workers
    // (e.g. no secure context) the app starts anyway, just without SharedArrayBuffer.
    (async () => {
      const flag = 'wp-isolation-reload';
      if ('serviceWorker' in navigator && window.isSecureContext) {
        try {
          await navigator.serviceWorker.register('sw.js', { scope: './' });
          await navigator.serviceWorker.ready;
          if (!self.crossOriginIsolated && !sessionStorage.getItem(flag)) {
            sessionStorage.setItem(flag, '1');
            location.reload();
            return;
          }
          if (self.crossOriginIsolated) sessionStorage.removeItem(flag);
        } catch (err) {
          console.warn(`Service worker: ${err}`);
        }
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
